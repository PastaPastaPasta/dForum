name: Pages

# The static index is the SEO/AI-facing shell. It is rebuilt hourly from the
# Dash Platform snapshot; live aspects fill in from the platform at runtime.
# A failing snapshot/build step fails the workflow and the last good deploy keeps serving.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tsc imports data/snapshot.json (gitignored, real one is generated by
      # snapshot.mjs); ensure the empty stub exists so a fresh clone type-checks.
      - name: Ensure snapshot stub
        run: node scripts/ensure-snapshot-stub.mjs
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npx next lint
      - name: Snapshot (static index data)
        run: node scripts/snapshot.mjs
        env:
          NEXT_PUBLIC_NETWORK: testnet
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_NETWORK: testnet
          # GH Pages serves under /dForum until forum.dashhq.org is live.
          # The custom domain doesn't exist yet; remove BASE_PATH once DNS
          # points the apex at this page.
          BASE_PATH: /dForum
          # The public origin the site is served from (no base path). The
          # sitemap/robots/llms.txt all use this — do not leave it pointing
          # somewhere that doesn't serve the site.
          SITE_URL: https://pastapastapasta.github.io
      - name: SEO files
        run: node scripts/generate-static-seo.mjs
        env:
          BASE_PATH: /dForum
          SITE_URL: https://pastapastapasta.github.io
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out

  deploy:
    # Only deploy from main — a workflow_dispatch from another branch builds
    # but must not publish.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
